<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos — Food Store Admin</title>
  <link rel="stylesheet" href="../../../style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2>🍔 Admin</h2>
      <a href="../adminHome/index.html">Dashboard</a>
      <a href="../categories/index.html">Categorías</a>
      <a href="./index.html" class="active">Productos</a>
      <a href="../orders/index.html">Pedidos</a>
      <a href="../../store/home/index.html">Ver tienda</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm" style="margin-top:auto;width:100%">Salir</button>
    </aside>
    <main class="admin-content">
      <div class="flex-between mb-2">
        <h1 class="page-title">Productos</h1>
        <button id="newBtn" class="btn btn-primary">+ Nuevo producto</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>ID</th><th>Imagen</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody id="prodBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">✕</button>
      <h2 id="modalTitle">Nuevo producto</h2>
      <form id="prodForm">
        <input type="hidden" id="editId" />
        <div class="form-group"><label>Nombre *</label><input type="text" id="nombre" required /></div>
        <div class="form-group"><label>Descripción</label><input type="text" id="descripcion" /></div>
        <div class="form-group"><label>Precio * (> 0)</label><input type="number" id="precio" min="0.01" step="0.01" required /></div>
        <div class="form-group"><label>Stock * (>= 0)</label><input type="number" id="stock" min="0" required /></div>
        <div class="form-group"><label>Categoría *</label><select id="categoriaId" required></select></div>
        <div class="form-group"><label>Imagen (URL)</label><input type="text" id="imagen" /></div>
        <div class="form-group">
          <label>Disponible</label>
          <select id="disponible">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Guardar</button>
      </form>
    </div>
  </div>

  <script type="module" src="./products.ts"></script>
</body>
</html>
