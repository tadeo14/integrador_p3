<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="#">🍔 Food Store</a>
    <div class="navbar-links">
      <a href="../home/index.html">← Seguir comprando</a>
      <button id="logoutBtn" class="btn btn-outline btn-sm">Salir</button>
    </div>
  </nav>

  <div style="max-width:900px;margin:2rem auto;padding:0 1rem">
    <div class="flex-between mb-2">
      <h1 class="page-title">Carrito de compras</h1>
      <button id="clearBtn" class="btn btn-danger btn-sm">Vaciar carrito</button>
    </div>
    <div id="cartContainer"></div>
  </div>

  <!-- Modal checkout -->
  <div id="checkoutModal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Confirmar pedido</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Teléfono de contacto</label>
          <input type="tel" id="telefono" placeholder="Ej: 1122334455" required />
        </div>
        <div class="form-group">
          <label>Forma de pago</label>
          <select id="formaPago" required>
            <option value="">Seleccioná...</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="EFECTIVO">Efectivo</option>
          </select>
        </div>
        <div id="orderSummary"></div>
        <button type="submit" class="btn btn-primary mt-2" style="width:100%">Confirmar pedido</button>
      </form>
    </div>
  </div>

  <script type="module" src="./cart.ts"></script>
</body>
</html>
