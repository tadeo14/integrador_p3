<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Crear cuenta</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña (mín. 6 caracteres)</label>
          <input type="password" id="password" minlength="6" required />
        </div>
        <div id="error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Registrarse</button>
      </form>
      <p class="text-center mt-2">¿Ya tenés cuenta? <a href="../login/index.html">Ingresar</a></p>
    </div>
  </div>
  <script type="module" src="./register.ts"></script>
</body>
</html>
