<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>🍔 Food Store</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••" required />
        </div>
        <div id="error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Ingresar</button>
      </form>
      <p class="text-center mt-2">¿No tenés cuenta? <a href="../register/index.html">Registrate</a></p>
    </div>
  </div>
  <script type="module" src="./login.ts"></script>
</body>
</html>
