plugins {
    id 'java'
    id 'application'
}

group = 'com.tp.jpa'
version = '1.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

application {
    mainClass = 'com.tp.jpa.Main'
}

run {
    // Permite que el Scanner lea desde la consola al usar gradlew run
    standardInput = System.in
    // Fuerza UTF-8 en la JVM para evitar caracteres rotos en Windows
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.register('seed', JavaExec) {
    group = 'application'
    description = 'Carga datos iniciales (categorias, productos, usuarios y pedidos) en la base H2'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tp.jpa.util.DataSeeder'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.tp.jpa.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
